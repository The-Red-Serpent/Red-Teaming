
# PICOM V13 - KALI LINUX / I3

# Backend
backend = "glx";
vsync = true;

# Transparency
active-opacity = 1.0;
inactive-opacity = 0.90;
frame-opacity = 0.85;
inactive-opacity-override = false;
detect-client-opacity = true;

# Rounded corners
corner-radius = 5;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];



rounded-corners-exclude = [
    "class_g = 'Rofi'"
];
# Application opacity
opacity-rule = [
  "90:class_g = 'Rofi'",
  "90:class_g = 'Alacritty'",
  "90:class_g = 'kitty'"
];

# Blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.55;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Window detection
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Shadow exclusions
shadow-exclude = [
  "class_g = 'Conky'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Window types
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
