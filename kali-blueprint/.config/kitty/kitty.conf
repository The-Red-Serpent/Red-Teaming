
# ==========================================
# KITTY — GLASSY CYBERPUNK
# Floating window with desktop spacing
# ==========================================

# Font
font_family JetBrainsMono Nerd Font 11
font_size 20
bold_font auto
italic_font auto
disable_ligatures never
force_ltr no

# Remote Control
allow_remote_control yes

# Copy directly to the system clipboard
copy_on_select yes

# Glass effect
#background_opacity 0.50
background #000000
foreground #ffffff
selection_background #2a2f45
selection_foreground #ffffff
cursor #7aa2f7
cursor_text_color #101522
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0


# ==========================================
# WINDOW SIZE AND PLACEMENT
# ==========================================

# Open as a smaller window, not screen-sized
remember_window_size yes
initial_window_width 120c
initial_window_height 25c
placement_strategy center


# Keep a little internal spacing
window_padding_width 2
window_margin_width 2
single_window_margin_width 2

# Border and appearance
window_border_width 0.5
window_border_radius 5
hide_window_decorations no
draw_minimal_borders yes
active_border_color white

# Layouts and resizing
enabled_layouts *
window_resize_step_cells 2
window_resize_step_lines 2

# ==========================================
# TABS
# ==========================================

tab_bar_edge hidden
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 3
tab_bar_margin_width 1
tab_bar_align center
tab_title_template {index}
active_tab_title_template "▶ {index}"
active_tab_foreground #ffffff
active_tab_background #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #1f2438

# ==========================================
# SCROLLBACK
# ==========================================

scrollback_lines 20000
shell_integration enabled

# ==========================================
# MOUSE
# ==========================================

mouse_hide_wait 3.0
focus_follows_mouse no
click_interval -1.0
drag_threshold 5
# Disable the default plain left-click from opening URLs
mouse_map left click ungrabbed no-op

# Force it to require Ctrl+Click to open a link instead
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt

# ==========================================
# URL HANDLING
# ==========================================

url_color #7aa2f7
url_style curly
detect_urls yes
open_url_with default
show_hyperlink_targets ctrl
underline_hyperlinks hover

# ==========================================
# CLIPBOARD
# ==========================================

copy_on_select no
clear_selection_on_clipboard_loss no
paste_actions quote-urls-at-prompt,confirm
strip_trailing_spaces smart

map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# ==========================================
# TEXT SELECTION AND POINTER
# ==========================================

select_by_word_characters @-./_~?&=%+#
default_pointer_shape beam
pointer_shape_when_dragging beam
pointer_shape_when_grabbed arrow

# ==========================================
# PERFORMANCE
# ==========================================

sync_to_monitor yes

# ==========================================
# SHORTCUTS
# ==========================================

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_window
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+equal change_font_size all +1
map ctrl+shift+minus change_font_size all -1

# Split panes
map ctrl+alt+h launch --location=hsplit
map ctrl+alt+v launch --location=vsplit

# Navigate panes
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down
# Close current pane
map ctrl+alt+w close_window

# Switch to specific tabs using Alt + Number
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10


# Resize panes using Alt + Shift + Arrow keys
map alt+shift+left resize_window narrower 3
map alt+shift+right resize_window wider 3
map alt+shift+up resize_window taller 3
map alt+shift+down resize_window shorter 3

# Optional: Reset a pane back to its default equal size
map alt+shift+r resize_window reset
