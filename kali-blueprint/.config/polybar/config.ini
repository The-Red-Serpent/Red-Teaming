
[colors]
background = #00000000
foreground =#eee
cyan = #FFFFFF
purple = #b026ff
red = #ff3355


[bar/main]
width = 100%
height = 24
offset-x = 3
offset-y = 3

fixed-center = true

background = #00000000
foreground = ${colors.foreground}

radius = 10
border-size = 0
border-color = #00000000

line-size = 0
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=10;2

modules-left = kali i3
modules-center = date
modules-right = cpu memory ip power


[module/kali]
type = custom/text
content = " "
content-foreground = ${colors.cyan}

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = false
label-focused = %index%
label-focused-foreground = ${colors.cyan}
label-focused-underline = #000000
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1


[module/cpu]
type = internal/cpu
interval = 2
label =   %percentage%%
label-foreground = ${colors.cyan}

[module/memory]
type = internal/memory
interval = 2
label = 󱤓 %percentage_used%%
label-foreground = ${colors.cyan}

[module/date]
type = internal/date
interval = 1
date = %d %b
time = %H:%M
label = %date% | %time%
label-foreground = ${colors.foreground}

[module/power]
type = custom/text
content = 󰐥
content-foreground = #ff3355
label-padding = 0
content-padding = 0
click-left = ~/.config/polybar/power-menu.sh


[module/ip]
type = custom/script
exec = ~/.config/polybar/ip.sh
interval = 5
label = %output%
format = <label>
label-foreground = ${colors.foreground}

